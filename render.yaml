services:
  - type: web
    name: eclipse-poll-api
    runtime: node
    plan: free
    # Root directory is set to 'attestation-api' in Render dashboard
    # So all paths below are relative to attestation-api/
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false   # https://eclipse-poll.vercel.app
      - key: ATTESTATION_SECRET_KEY
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Coming Soon (leave empty) ──────────────────────────────────────────
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: TWITTERAPI_IO_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
